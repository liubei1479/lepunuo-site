name: Daily report & alert

on:
  schedule:
    # 北京时间 08:30（UTC 00:30）
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daily report & push to DingTalk
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: node scripts/daily-report.mjs