name: Daily report & alert

on:
  schedule:
    # 北京时间 10:00（UTC 02:00）
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daily report & push to DingTalk
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          echo "diag webhook_len=${#DINGTALK_WEBHOOK} token_len=${#ADMIN_TOKEN}"
          node scripts/daily-report.mjs